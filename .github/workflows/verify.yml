name: verify + selfcheck
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly selfcheck read of prod
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: verify-artifacts, path: artifacts/ }
  selfcheck-prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - run: node scripts/selfcheck-local.mjs https://interlinear-reader.pages.dev --tries=5
